<style>
.admin-panel {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;

.admin-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

[data-user-color-scheme="dark"] .admin-card {
    background: rgba(30, 30, 30, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.1);

}

.admin-title {
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 30px;

    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

}

.stat-item {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.stat-number {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 5px;
}

.stat-label {
    font-size: 0.9rem;
    opacity: 0.9;
}

.participants-list {
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 10px;
    padding: 15px;
}

[data-user-color-scheme="dark"] .participants-list {
    border-color: rgba(255, 255, 255, 0.1);
}

.participant-item {
    display: flex;

    padding: 10px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);

}

[data-user-color-scheme="dark"] .participant-item {
    border-bottom-color: rgba(255, 255, 255, 0.05);
}

.participant-item:hover {
    background-color: rgba(102, 126, 234, 0.05);
}

.participant-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 15px;
    border: 2px solid rgba(102, 126, 234, 0.3);
}

.participant-info {
    flex: 1;
}

.participant-qq {
    font-weight: 600;
    margin-bottom: 2px;
}

.participant-time {
    font-size: 0.8rem;
    color: #6b7280;
}

[data-user-color-scheme="dark"] .participant-time {
    color: #9ca3af;
}

.refresh-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 25px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    margin-bottom: 20px;
}

.refresh-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.refresh-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.error {
    text-align: center;
    padding: 40px;
    color: #ef4444;
    background: rgba(239, 68, 68, 0.1);
    border-radius: 10px;

}

<script>
// 内联JavaScript以避免路径问题
(function () {
    const BASE_API = "https://lottery-api.19921461660.workers.dev";
    const ADMIN_API = `${BASE_API}/admin/status`;
    const STATS_API = `${BASE_API}/stats`;

    // 管理员Token - 实际使用时应该通过安全方式获取
    const ADMIN_TOKEN = prompt("请输入管理员密码：");

    if (!ADMIN_TOKEN) {
        document.body.innerHTML = `
            <div style="text-align: center; padding: 50px; color: #ef4444;">
                <h2>❌ 访问被拒绝</h2>
                <p>需要管理员权限才能访问此页面</p>
            </div>
        `;
        return;
    }

    let statsSection, participantListEl, refreshBtn, diagnosisBtn, errorMessage;

    // 初始化DOM元素
    function initElements() {
        statsSection = document.getElementById('statsSection');
        participantListEl = document.getElementById('participantsList');
        refreshBtn = document.getElementById('refreshBtn');
        diagnosisBtn = document.getElementById('diagnosisBtn');
        errorMessage = document.getElementById('errorMessage');

        console.log('DOM元素初始化:', {
            statsSection: !!statsSection,
            participantListEl: !!participantListEl,
            refreshBtn: !!refreshBtn,
            diagnosisBtn: !!diagnosisBtn,
            errorMessage: !!errorMessage
        });
    }

    // 带认证的API请求
    async function authenticatedFetch(url, options = {}) {
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${ADMIN_TOKEN}`,
            ...options.headers
        };

        return fetch(url, {
            ...options,
            headers
        });
    }

    // 获取管理员数据
    async function loadAdminData() {
        try {
            showLoading();

            const response = await authenticatedFetch(ADMIN_API);
            const data = await response.json();

            // 添加调试日志
            console.log('管理员API响应状态:', response.status);
            console.log('管理员API返回数据:', data);

            if (!response.ok) {
                if (response.status === 401) {
                    throw new Error('管理员认证失败，请检查密码');
                }
                throw new Error(data.message || '获取管理员数据失败');
            }

            if (data.success) {
                displayAdminData(data);
            } else {
                throw new Error(data.message || '数据格式错误');
            }

        } catch (error) {
            console.error('加载管理员数据失败:', error);
            showError(error.message);
        } finally {
            hideLoading();
        }
    }

    // 获取统计数据
    async function loadStats() {
        try {
            const response = await fetch(STATS_API);
            const data = await response.json();

            if (response.ok && data.success) {
                updateStats(data);
            }
        } catch (error) {
            console.warn('获取统计数据失败:', error);
        }
    }

    // 显示管理员数据
    function displayAdminData(data) {
        console.log('开始显示管理员数据:', data);

        // 创建统计数据显示
        if (statsSection) {
            const count = data.count || 0;
            statsSection.innerHTML = `
                <div class="stat-item">
                    <div class="stat-number">${count}</div>
                    <div class="stat-label">总参与人数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${count}</div>
                    <div class="stat-label">独立IP数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${new Date().toLocaleString('zh-CN')}</div>
                    <div class="stat-label">最后更新</div>
                </div>
            `;
            console.log('设置统计数据:', count);
        }

        // 显示参与者列表 - 修复字段映射
        console.log('检查参与者列表:', {
            hasParticipantListEl: !!participantListEl,
            hasLatestData: !!data.latest,
            latestData: data.latest,
            latestLength: data.latest ? data.latest.length : 0,
            fullData: data
        });

        if (participantListEl && data.latest && data.latest.length > 0) {
            console.log('调用displayParticipants，参与者数量:', data.latest.length);
            console.log('参与者详细数据:', data.latest);
            displayParticipants(data.latest);
        } else {
            console.log('未显示参与者列表，原因:', {
                noElement: !participantListEl,
                noData: !data.latest,
                emptyData: data.latest && data.latest.length === 0
            });
            // 如果没有数据，显示空状态
            if (participantListEl) {
                displayParticipants([]);
            }
        }
    }

    // 更新统计数据
    function updateStats(data) {
        if (statsSection) {
            const count = data.count || 0;
            statsSection.innerHTML = `
                <div class="stat-item">
                    <div class="stat-number">${count}</div>
                    <div class="stat-label">总参与人数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${count}</div>
                    <div class="stat-label">独立IP数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${new Date().toLocaleString('zh-CN')}</div>
                    <div class="stat-label">最后更新</div>
                </div>
            `;
        }
    }

    // 生成备用头像URL列表
    function getAvatarUrls(qq) {
        return [
            `https://q.qlogo.cn/g?b=qq&nk=${encodeURIComponent(qq)}&s=100`,
            `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(qq)}&s=100`,
            `https://q2.qlogo.cn/g?b=qq&nk=${encodeURIComponent(qq)}&s=100`,
            // 备用：使用代理服务
            `https://images.weserv.nl/?url=q.qlogo.cn/g?b=qq%26nk=${encodeURIComponent(qq)}%26s=100`,
        ];
    }

    // 创建头像元素，支持多个备用URL
    function createAvatarElement(qq, index) {
        const avatarUrls = getAvatarUrls(qq);
        const avatarId = `avatar-${index}`;
        
        console.log(`参与者 ${index} 头像URL列表:`, avatarUrls);

        // 创建头像HTML，包含备用URL逻辑
        return `
            <img id="${avatarId}" class="participant-avatar" src="${avatarUrls[0]}" srcset="/img/loading.gif" lazyload alt="QQ头像" 
                 data-urls='${JSON.stringify(avatarUrls)}' 
                 data-current-index="0"
                 onerror="window.handleAvatarError(this)"
                 onload="console.log('头像加载成功:', this.src)">
        `;
    }

    // 全局头像错误处理函数
    window.handleAvatarError = function(img) {
        const urls = JSON.parse(img.getAttribute('data-urls') || '[]');
        const currentIndex = parseInt(img.getAttribute('data-current-index') || '0');
        const nextIndex = currentIndex + 1;
        
        console.error('头像加载失败:', img.src);
        
        if (nextIndex < urls.length) {
            console.log(`尝试备用头像URL ${nextIndex}:`, urls[nextIndex]);
            img.setAttribute('data-current-index', nextIndex);
            img.src = urls[nextIndex];
        } else {
            console.log('所有头像URL都失败，使用默认头像');
            // 使用默认头像SVG
            img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGRlZnM+CjxsaW5lYXJHcmFkaWVudCBpZD0iZ3JhZGllbnQiIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPgo8c3RvcCBvZmZzZXQ9IjAlIiBzdHlsZT0ic3RvcC1jb2xvcjojNjY3ZWVhO3N0b3Atb3BhY2l0eToxIiAvPgo8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0eWxlPSJzdG9wLWNvbG9yOiM3NjRiYTI7c3RvcC1vcGFjaXR5OjEiIC8+CjwvbGluZWFyR3JhZGllbnQ+CjwvZGVmcz4KPGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMjAiIGZpbGw9InVybCgjZ3JhZGllbnQpIi8+CjxjaXJjbGUgY3g9IjIwIiBjeT0iMTYiIHI9IjYiIGZpbGw9IndoaXRlIiBvcGFjaXR5PSIwLjkiLz4KPHBhdGggZD0iTTEwIDMwYzAtNSA0LjUtOSAxMC05czEwIDQgMTAgOXYySDEwdi0yeiIgZmlsbD0id2hpdGUiIG9wYWNpdHk9IjAuOSIvPgo8L3N2Zz4K';
        }
    };

    // 显示参与者列表
    function displayParticipants(participants) {
        console.log('显示参与者列表，数量:', participants.length);
        console.log('参与者数据:', participants);
        
        if (!participantListEl) {
            console.error('找不到participantsList元素');
            return;
        }

        if (!participants || participants.length === 0) {
            participantListEl.innerHTML = `
                <div style="text-align: center; padding: 40px; color: #6b7280;">
                    <div style="font-size: 2rem; margin-bottom: 16px;">📝</div>
                    <div>暂无参与者数据</div>
                </div>
            `;
            return;
        }

        let html = '';
        participants.forEach((participant, index) => {
            console.log(`参与者 ${index}:`, participant);
            // 使用完整QQ号
            const qq = participant.qq || participant.qqMasked || '未知';
            const time = participant.joinedAt ? 
                new Date(participant.joinedAt).toLocaleString('zh-CN') : 
                '未知时间';
            
            // 创建支持多备用URL的头像元素
            const avatarHtml = createAvatarElement(qq, index);

            html += `
                <div class="participant-item" style="animation-delay: ${index * 0.05}s">
                    ${avatarHtml}
                    <div class="participant-info">
                        <div class="participant-qq">QQ: ${qq}</div>
                        <div class="participant-time">时间: ${time}</div>
                    </div>
                    <div class="participant-index">#${index + 1}</div>
                </div>
            `;
        });

        participantListEl.innerHTML = html;
        console.log('参与者列表HTML已更新');
        
        // 添加网络诊断
        setTimeout(() => {
            console.log('=== 头像加载诊断 ===');
            const avatars = document.querySelectorAll('.participant-avatar');
            avatars.forEach((img, index) => {
                console.log(`头像 ${index}:`, {
                    src: img.src,
                    complete: img.complete,
                    naturalWidth: img.naturalWidth,
                    naturalHeight: img.naturalHeight
                });
            });
        }, 2000);
    }

    // 显示加载状态
    function showLoading() {
        if (participantListEl) {
            participantListEl.innerHTML = `
                <div style="text-align: center; padding: 40px; color: #6b7280;">
                    <div style="font-size: 2rem; margin-bottom: 16px;">⏳</div>
                    <div>正在加载数据...</div>
                </div>
            `;
        }
        if (refreshBtn) {
            refreshBtn.disabled = true;
            refreshBtn.textContent = '加载中...';
        }
    }

    // 隐藏加载状态
    function hideLoading() {
        if (refreshBtn) {
            refreshBtn.disabled = false;
            refreshBtn.textContent = '🔄 刷新数据';
        }
    }

    // 显示错误信息
    function showError(message) {
        if (participantListEl) {
            participantListEl.innerHTML = `
                <div style="text-align: center; padding: 40px; color: #ef4444; background: rgba(239, 68, 68, 0.1); border-radius: 10px; margin: 20px 0;">
                    <div style="font-size: 2rem; margin-bottom: 16px;">❌</div>
                    <div style="color: #ef4444; font-weight: 600; margin-bottom: 8px;">加载失败</div>
                    <div style="color: #6b7280;">${message}</div>
                </div>
            `;
        }
    }

    // 网络诊断功能
    async function runNetworkDiagnosis() {
        console.log('=== 开始网络诊断 ===');
        
        const testQQ = '123456789'; // 测试用QQ号
        const testUrls = getAvatarUrls(testQQ);
        
        console.log('测试QQ头像URL:', testUrls);
        
        for (let i = 0; i < testUrls.length; i++) {
            const url = testUrls[i];
            console.log(`测试URL ${i + 1}:`, url);
            
            try {
                // 尝试创建图片元素测试
                const img = new Image();
                const loadPromise = new Promise((resolve, reject) => {
                    img.onload = () => resolve({ success: true, width: img.width, height: img.height });
                    img.onerror = () => reject(new Error('图片加载失败'));
                    setTimeout(() => reject(new Error('加载超时')), 5000);
                });
                
                img.src = url;
                const result = await loadPromise;
                console.log(`✅ URL ${i + 1} 成功:`, result);
                
            } catch (error) {
                console.log(`❌ URL ${i + 1} 失败:`, error.message);
                
                // 尝试fetch测试
                try {
                    const response = await fetch(url, { 
                        method: 'HEAD',
                        mode: 'no-cors'
                    });
                    console.log(`  Fetch测试: 状态未知 (no-cors模式)`);
                } catch (fetchError) {
                    console.log(`  Fetch测试失败:`, fetchError.message);
                }
            }
        }
        
        // 测试API连接
        console.log('测试API连接...');
        try {
            const response = await fetch(BASE_API);
            const data = await response.json();
            console.log('✅ API连接正常:', data);
        } catch (error) {
            console.log('❌ API连接失败:', error.message);
        }
        
        console.log('=== 网络诊断完成 ===');
        alert('网络诊断完成，请查看浏览器控制台获取详细信息');
    }

    // 刷新数据
    async function refreshData() {
        await Promise.all([
            loadAdminData(),
            loadStats()
        ]);
    }

    // 初始化
    async function init() {
        // 首先初始化DOM元素
        initElements();

        // 绑定按钮事件
        if (refreshBtn) {
            refreshBtn.addEventListener('click', refreshData);
        }
        if (diagnosisBtn) {
            diagnosisBtn.addEventListener('click', runNetworkDiagnosis);
        }

        // 立即加载数据
        await refreshData();

        // 每60秒自动刷新一次
        setInterval(refreshData, 60000);
    }

    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        // 如果页面已经加载完成，延迟一点再初始化，确保DOM完全渲染
        setTimeout(init, 100);
    }
})();
</script>
